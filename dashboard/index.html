<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMatch Tracking Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-inner">
          <h1>Tracking Dashboard</h1>
          <button class="refresh-btn" onclick="renderDashboard()">Refresh</button>
        </div>
        <div class="filter-bar" style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:flex-end; margin-top: 1rem;">
          <label style="display:flex; align-items:center; gap:8px; color:#475467; font-size:0.95rem;">From<input id="dateFrom" type="date" style="padding:0.55rem 0.7rem; border-radius:10px; border:1px solid #d0d5dd; background:#fff;" /></label>
          <label style="display:flex; align-items:center; gap:8px; color:#475467; font-size:0.95rem;">To<input id="dateTo" type="date" style="padding:0.55rem 0.7rem; border-radius:10px; border:1px solid #d0d5dd; background:#fff;" /></label>
          <button class="refresh-btn" onclick="renderDashboard()" style="margin-left: 0.25rem;">Apply</button>
          <button class="refresh-btn" onclick="clearDateFilter()" style="background:#eef2ff; color:#4338ca;">Clear</button>
        </div>
      </header>

      <section class="stats-grid" id="statsGrid"></section>

      <section class="layout">
        <div class="panel">
          <div class="panel-header">Recent Events</div>
          <div class="panel-body">
            <table>
              <thead>
                <tr>
                  <th>Event</th>
                  <th>Page</th>
                  <th>Time</th>
                  <th>User</th>
                </tr>
              </thead>
              <tbody id="eventTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Event Totals</div>
          <div class="panel-body">
            <div id="eventTotals" class="chip-list"></div>
          </div>
        </div>
      </section>

      <section class="layout">
        <div class="panel">
          <div class="panel-header">Bookings by Therapist</div>
          <div class="panel-body">
            <div id="therapistBreakdown" class="chip-list"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Clicks by Source</div>
          <div class="panel-body">
            <div id="sourceBreakdown" class="chip-list"></div>
          </div>
        </div>
      </section>

      <section class="layout">
        <div class="panel">
          <div class="panel-header">Source Conversion Rates</div>
          <div class="panel-body">
            <div id="sourceConversionBreakdown" class="chip-list"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Overall Conversion</div>
          <div class="panel-body">
            <div id="overallConversion" class="chip-list"></div>
          </div>
        </div>
      </section>

      <section class="layout">
        <div class="panel">
          <div class="panel-header">Mouse Movement</div>
          <div class="panel-body">
            <div id="mouseMovementSummary" class="chip-list"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Hover Heatmap</div>
          <div class="panel-body">
            <div id="hoverHeatmapSummary" class="chip-list"></div>
          </div>
        </div>
      </section>

      <section class="panel chart-panel">
        <div class="panel-header">Landing vs Bookings</div>
        <div class="panel-body">
          <div id="chartWrap" class="chart-wrap"></div>
        </div>
      </section>
    </div>

    <script>
      const STORAGE_KEY = 'websiteTrackingEvents';
      const REDIRECT_STORAGE_KEY = 'redirectLandingVisits';

      function getEvents() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        } catch (error) {
          return [];
        }
      }

      function getRedirectLandingStats() {
        try {
          return JSON.parse(localStorage.getItem(REDIRECT_STORAGE_KEY) || '{}');
        } catch (error) {
          return {};
        }
      }

      function getDateFilter() {
        const fromField = document.getElementById('dateFrom');
        const toField = document.getElementById('dateTo');
        return {
          from: fromField ? fromField.value : '',
          to: toField ? toField.value : ''
        };
      }

      function filterEventsByDate(events) {
        const { from, to } = getDateFilter();
        if (!from && !to) return events;

        return events.filter((event) => {
          if (!event.timestamp) return true;

          const eventDate = new Date(event.timestamp);
          const fromDate = from ? new Date(`${from}T00:00:00`) : null;
          const toDate = to ? new Date(`${to}T23:59:59`) : null;

          if (fromDate && eventDate < fromDate) return false;
          if (toDate && eventDate > toDate) return false;
          return true;
        });
      }

      function clearDateFilter() {
        const fromField = document.getElementById('dateFrom');
        const toField = document.getElementById('dateTo');
        if (fromField) fromField.value = '';
        if (toField) toField.value = '';
        renderDashboard();
      }

      function renderDashboard() {
        const events = filterEventsByDate(getEvents());
        const redirectStats = getRedirectLandingStats();

        const totalEvents = events.length;
        const pageViews = events.filter((event) => event.eventName === 'page_view').length;
        const clicks = events.filter((event) => event.eventName === 'cta_click').length;
        const formSubmits = events.filter((event) => event.eventName === 'form_submit').length;
        const bookedAppointments = events.filter((event) => event.eventName === 'book_appointment').length;
        const redirectVisits = Object.values(redirectStats).reduce((sum, item) => sum + (item.total || 0), 0);
        const uniqueUsers = new Set(events.map((event) => event.userId).filter(Boolean)).size;
        const overallConversionRate = pageViews > 0 ? (bookedAppointments / pageViews) * 100 : 0;
        const redirectConversionRate = redirectVisits > 0 ? (bookedAppointments / redirectVisits) * 100 : 0;

        const therapistSummary = events
          .filter((event) => event.eventName === 'book_appointment')
          .reduce((acc, event) => {
            const therapistName = event.therapist || 'Unknown therapist';
            acc[therapistName] = (acc[therapistName] || 0) + 1;
            return acc;
          }, {});

        const clickSourceSummary = events
          .filter((event) => event.eventName === 'cta_click' || event.eventName === 'outbound_click')
          .reduce((acc, event) => {
            const source = event.source || 'direct';
            acc[source] = (acc[source] || 0) + 1;
            return acc;
          }, {});

        const sourceTrafficSummary = events
          .filter((event) => event.eventName === 'page_view' || event.eventName === 'cta_click')
          .reduce((acc, event) => {
            const source = event.source || 'direct';
            acc[source] = (acc[source] || 0) + 1;
            return acc;
          }, {});

        const bookingsBySource = events
          .filter((event) => event.eventName === 'book_appointment')
          .reduce((acc, event) => {
            const source = event.source || 'direct';
            acc[source] = (acc[source] || 0) + 1;
            return acc;
          }, {});

        const sourceConversionSummary = Object.entries(sourceTrafficSummary).reduce((acc, [source, traffic]) => {
          const bookings = bookingsBySource[source] || 0;
          acc[source] = traffic > 0 ? (bookings / traffic) * 100 : 0;
          return acc;
        }, {});

        const mouseSet = events.filter((event) => event.eventName === 'mouse_move');
        const mouseHotspots = mouseSet.reduce((acc, event) => {
          const key = `${Math.round((event.x || 0) / 100) * 100},${Math.round((event.y || 0) / 100) * 100}`;
          acc[key] = (acc[key] || 0) + 1;
          return acc;
        }, {});

        const hoverHotspots = events
          .filter((event) => event.eventName === 'hover_heatmap')
          .reduce((acc, event) => {
            const key = event.element || 'unknown';
            acc[key] = (acc[key] || 0) + 1;
            return acc;
          }, {});

        const statsGrid = document.getElementById('statsGrid');
        statsGrid.innerHTML = `
          <div class="stat-card">
            <span class="stat-label">Total events</span>
            <div class="stat-value">${totalEvents}</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">Page views</span>
            <div class="stat-value">${pageViews}</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">CTA clicks</span>
            <div class="stat-value">${clicks}</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">Form submits</span>
            <div class="stat-value">${formSubmits}</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">Booked</span>
            <div class="stat-value">${bookedAppointments}</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">Mouse moves</span>
            <div class="stat-value">${mouseSet.length}</div>
          </div>
        `;

        const eventTableBody = document.getElementById('eventTableBody');
        eventTableBody.innerHTML = events.slice(-10).reverse().map((event) => `
          <tr>
            <td>${event.eventName}</td>
            <td>${event.page || '/'}</td>
            <td>${new Date(event.timestamp).toLocaleString()}</td>
            <td>${event.userId || 'anonymous'}</td>
          </tr>
        `).join('');

        const totals = events.reduce((acc, event) => {
          acc[event.eventName] = (acc[event.eventName] || 0) + 1;
          return acc;
        }, {});

        const eventTotals = document.getElementById('eventTotals');
        const redirectSources = Object.entries(redirectStats).reduce((acc, [page, pageData]) => {
          Object.entries(pageData.sources || {}).forEach(([source, count]) => {
            acc[source] = (acc[source] || 0) + count;
          });
          return acc;
        }, {});

        const summaryChips = [
          ...Object.entries(totals)
            .sort((a, b) => b[1] - a[1])
            .map(([name, count]) => `<span class="chip">${name}: ${count}</span>`),
          ...Object.entries(redirectSources)
            .map(([source, count]) => `<span class="chip">redirect:${source}: ${count}</span>`)
        ];

        eventTotals.innerHTML = summaryChips.join('');

        const therapistBreakdown = document.getElementById('therapistBreakdown');
        therapistBreakdown.innerHTML = Object.entries(therapistSummary)
          .sort((a, b) => b[1] - a[1])
          .map(([therapist, count]) => `<span class="chip">${therapist}: ${count}</span>`)
          .join('') || '<span class="chip">No bookings yet</span>';

        const sourceBreakdown = document.getElementById('sourceBreakdown');
        sourceBreakdown.innerHTML = Object.entries(clickSourceSummary)
          .sort((a, b) => b[1] - a[1])
          .map(([source, count]) => `<span class="chip">${source}: ${count}</span>`)
          .join('') || '<span class="chip">No click sources yet</span>';

        const sourceConversionBreakdown = document.getElementById('sourceConversionBreakdown');
        sourceConversionBreakdown.innerHTML = Object.entries(sourceConversionSummary)
          .sort((a, b) => b[1] - a[1])
          .map(([source, rate]) => `<span class="chip">${source}: ${rate.toFixed(1)}%</span>`)
          .join('') || '<span class="chip">No conversion data yet</span>';

        const overallConversion = document.getElementById('overallConversion');
        overallConversion.innerHTML = `
          <span class="chip">Overall: ${overallConversionRate.toFixed(1)}%</span>
          <span class="chip">Redirect: ${redirectConversionRate.toFixed(1)}%</span>
          <span class="chip">Unique users: ${uniqueUsers}</span>
        `;

        const mouseMovementSummary = document.getElementById('mouseMovementSummary');
        mouseMovementSummary.innerHTML = Object.entries(mouseHotspots)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 6)
          .map(([pos, count]) => `<span class="chip">${pos}: ${count}</span>`)
          .join('') || '<span class="chip">No mouse movement yet</span>';

        const hoverHeatmapSummary = document.getElementById('hoverHeatmapSummary');
        hoverHeatmapSummary.innerHTML = Object.entries(hoverHotspots)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 6)
          .map(([element, count]) => `<span class="chip">${element}: ${count}</span>`)
          .join('') || '<span class="chip">No hover data yet</span>';

        const chartWrap = document.getElementById('chartWrap');
        const maxValue = Math.max(1, redirectVisits, bookedAppointments);

        chartWrap.innerHTML = `
          <div class="bar-group">
            <div class="bar" style="height: ${(redirectVisits / maxValue) * 100}%"></div>
            <div class="bar-label">Redirects</div>
            <div class="bar-label">${redirectVisits}</div>
          </div>
          <div class="bar-group">
            <div class="bar alt" style="height: ${(bookedAppointments / maxValue) * 100}%"></div>
            <div class="bar-label">Bookings</div>
            <div class="bar-label">${bookedAppointments}</div>
          </div>
        `;
      }

      const dateFrom = document.getElementById('dateFrom');
      const dateTo = document.getElementById('dateTo');
      if (dateFrom) {
        dateFrom.addEventListener('change', renderDashboard);
      }
      if (dateTo) {
        dateTo.addEventListener('change', renderDashboard);
      }

      renderDashboard();
      window.clearDateFilter = clearDateFilter;
    </script>
  </body>
</html>
