<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMatch Tracking Dashboard</title>
    <style>
      :root {
        --bg: #f6f0ea;
        --panel: #ffffff;
        --panel-soft: #f4f7fb;
        --text: #18314f;
        --muted: #586f86;
        --primary: #4f7dbd;
        --primary-dark: #345d97;
        --border: rgba(24, 49, 79, 0.1);
        --shadow: 0 18px 40px rgba(24, 49, 79, 0.08);
        --success: #2a9d8f;
        --warning: #f4a261;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
      }

      .header {
        padding: 24px 0 16px;
      }

      .header-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 2.8rem);
      }

      .refresh-btn {
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: white;
        padding: 0.8rem 1.4rem;
        font-weight: 700;
        cursor: pointer;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        margin: 24px 0 30px;
      }

      .stat-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 22px;
        box-shadow: var(--shadow);
      }

      .stat-label {
        display: block;
        color: var(--muted);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 12px;
      }

      .stat-value {
        font-size: clamp(2rem, 3vw, 2.5rem);
        font-weight: 700;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 22px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-header {
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
        background: var(--panel-soft);
      }

      .panel-body {
        padding: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 12px 8px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      th {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        display: inline-block;
        background: var(--panel-soft);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.5rem 0.8rem;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .chart-panel {
        margin-top: 22px;
      }

      .chart-wrap {
        display: flex;
        align-items: end;
        gap: 14px;
        height: 220px;
        padding-top: 18px;
      }

      .bar-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: end;
        align-items: center;
        gap: 10px;
        min-width: 90px;
      }

      .bar {
        width: 100%;
        max-width: 110px;
        border-radius: 12px 12px 0 0;
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
        min-height: 12px;
      }

      .bar.alt {
        background: linear-gradient(180deg, var(--success) 0%, #1d8177 100%);
      }

      .bar-label {
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 700;
      }

      @media (max-width: 860px) {
        .stats-grid,
        .layout {
          grid-template-columns: 1fr;
        }

        .header-inner {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-inner">
          <h1>Tracking Dashboard</h1>
          <button class="refresh-btn" onclick="renderDashboard()">Refresh</button>
        </div>
      </header>

      <section class="stats-grid" id="statsGrid"></section>

      <section class="layout">
        <div class="panel">
          <div class="panel-header">Recent Events</div>
          <div class="panel-body">
            <table>
              <thead>
                <tr>
                  <th>Event</th>
                  <th>Page</th>
                  <th>Time</th>
                </tr>
              </thead>
              <tbody id="eventTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Event Totals</div>
          <div class="panel-body">
            <div id="eventTotals" class="chip-list"></div>
          </div>
        </div>
      </section>

      <section class="panel chart-panel">
        <div class="panel-header">Landing vs Bookings</div>
        <div class="panel-body">
          <div id="chartWrap" class="chart-wrap"></div>
        </div>
      </section>
    </div>

    <script>
      const STORAGE_KEY = 'websiteTrackingEvents';
      const REDIRECT_STORAGE_KEY = 'redirectLandingVisits';

      function getEvents() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        } catch (error) {
          return [];
        }
      }

      function getRedirectLandingStats() {
        try {
          return JSON.parse(localStorage.getItem(REDIRECT_STORAGE_KEY) || '{}');
        } catch (error) {
          return {};
        }
      }

      function renderDashboard() {
        const events = getEvents();
        const redirectStats = getRedirectLandingStats();

        const totalEvents = events.length;
        const pageViews = events.filter((event) => event.eventName === 'page_view').length;
        const clicks = events.filter((event) => event.eventName === 'cta_click').length;
        const formSubmits = events.filter((event) => event.eventName === 'form_submit').length;
        const bookedAppointments = events.filter((event) => event.eventName === 'book_appointment').length;
        const redirectVisits = Object.values(redirectStats).reduce((sum, item) => sum + (item.total || 0), 0);

        const statsGrid = document.getElementById('statsGrid');
        statsGrid.innerHTML = `
          <div class="stat-card">
            <span class="stat-label">Total events</span>
            <div class="stat-value">${totalEvents}</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">Page views</span>
            <div class="stat-value">${pageViews}</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">CTA clicks</span>
            <div class="stat-value">${clicks}</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">Form submits</span>
            <div class="stat-value">${formSubmits}</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">Booked</span>
            <div class="stat-value">${bookedAppointments}</div>
          </div>
          <div class="stat-card">
            <span class="stat-label">Redirect visits</span>
            <div class="stat-value">${redirectVisits}</div>
          </div>
        `;

        const eventTableBody = document.getElementById('eventTableBody');
        eventTableBody.innerHTML = events.slice(-10).reverse().map((event) => `
          <tr>
            <td>${event.eventName}</td>
            <td>${event.page || '/'}</td>
            <td>${new Date(event.timestamp).toLocaleString()}</td>
          </tr>
        `).join('');

        const totals = events.reduce((acc, event) => {
          acc[event.eventName] = (acc[event.eventName] || 0) + 1;
          return acc;
        }, {});

        const eventTotals = document.getElementById('eventTotals');
        const redirectSources = Object.entries(redirectStats).reduce((acc, [page, pageData]) => {
          Object.entries(pageData.sources || {}).forEach(([source, count]) => {
            acc[source] = (acc[source] || 0) + count;
          });
          return acc;
        }, {});

        const summaryChips = [
          ...Object.entries(totals)
            .sort((a, b) => b[1] - a[1])
            .map(([name, count]) => `<span class="chip">${name}: ${count}</span>`),
          ...Object.entries(redirectSources)
            .map(([source, count]) => `<span class="chip">redirect:${source}: ${count}</span>`)
        ];

        eventTotals.innerHTML = summaryChips.join('');

        const chartWrap = document.getElementById('chartWrap');
        const maxValue = Math.max(1, redirectVisits, bookedAppointments);

        chartWrap.innerHTML = `
          <div class="bar-group">
            <div class="bar" style="height: ${(redirectVisits / maxValue) * 100}%"></div>
            <div class="bar-label">Redirects</div>
            <div class="bar-label">${redirectVisits}</div>
          </div>
          <div class="bar-group">
            <div class="bar alt" style="height: ${(bookedAppointments / maxValue) * 100}%"></div>
            <div class="bar-label">Bookings</div>
            <div class="bar-label">${bookedAppointments}</div>
          </div>
        `;
      }

      renderDashboard();
    </script>
  </body>
</html>
